                                  properties:
                                    type:
                                      const: INTERNATIONAL
                                then:
                                  required:
                                  - city
                                  - internationalPostalCode
                              - if:
                                  properties:
                                    type:
                                      const: DOMESTIC
                                then:
                                  required:
                                  - city
