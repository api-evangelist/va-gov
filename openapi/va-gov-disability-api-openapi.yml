                          serviceRelevance: Caused by a service-connected disability\nLengthy description
                      standardClaim: false
                      autoCestPDFGenerationDisabled: false
                      applicationExpirationDate: '2015-08-28T19:53:45+00:00'
                      serviceInformation:
