                                  type: string
                                  default: DOMESTIC
                                  enum:
                                  - INTERNATIONAL
                                  - MILITARY
                                  - DOMESTIC
                                  example: DOMESTIC
                                state:
                                  description: State or province Veteran resides in.
                                  type: string
                                  pattern: ^[a-z,A-Z]{2}$
                                  example: OR
                              allOf:
