                                  type: string
                                  pattern: ^([-a-zA-Z0-9'.,&#]([-a-zA-Z0-9'.,&# ])?)+$
                                  maxLength: 10
                                  example: Box 123
                                city:
                                  description: City Veteran resides in.
                                  type: string
                                  pattern: ^([-a-zA-Z0-9'.#]([-a-zA-Z0-9'.# ])?)+$
                                  maxLength: 20
                                  example: Portland
