                            routingNumber:
                              description: Routing number for the direct deposit.
                              type: string
                              nullable: true
                              maxLength: 9
                              example: '123123123'
                        claimantCertification:
                          type: boolean
                          description: Claimant certifies and authorizes release of information.
                          default: false
