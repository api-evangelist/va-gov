                            riskOfBecomingHomeless:
                              type: object
                              nullable: true
                              additionalProperties: false
                              properties:
                                livingSituationOptions:
                                  type: string
                                  nullable: true
                                  default: HOUSING_WILL_BE_LOST_IN_30_DAYS
                                  enum:
