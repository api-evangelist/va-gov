                                  - OTHER
                                otherDescription:
                                  description: Explanation of living situation. Required if 'livingSituationOptions' is 'OTHER'.
                                  type: string
                                  nullable: true
                                  maxLength: 500
                                  example: other living situation
                            pointOfContact:
                              description: Individual in direct contact with Veteran.
                              type: string
                              nullable: true
                              minLength: 1
                              maxLength: 100
                              pattern: ^([-a-zA-Z0-9/']+( ?))*$
                              example: Jane Doe
                            pointOfContactNumber:
                              type: object
