                              type: string
                              enum:
                              - 'YES'
                              - 'NO'
                              description: Did Veteran serve in a combat zone since 9-11-2001?
                              example: 'YES'
                              nullable: true
                            reservesNationalGuardService:
                              type: object
                              nullable: true
                              additionalProperties: false
                              properties:
                                component:
                                  type: string
                                  nullable: true
                                  description: ''
                                  enum:
                                  - Reserves
                                  - National Guard
                                obligationTermsOfService:
                                  type: object
                                  nullable: true
                                  description: 'If ''obligationTermsOfService'' is included, the following attributes are required: ''beginDate '' and ''endDate''.'
                                  additionalProperties: false
                                  properties:
                                    beginDate:
                                      type: string
                                      nullable: true
                                      pattern: ^(?:[0-9]{4})-(?:0[1-9]|1[0-2])-(?:0[1-9]|[1-2][0-9]|3[0-1])$
                                      example: '2018-06-06'
                                    endDate:
                                      type: string
                                      nullable: true
                                      pattern: ^(?:[0-9]{4})-(?:0[1-9]|1[0-2])-(?:0[1-9]|[1-2][0-9]|3[0-1])$
                                      example: '2018-06-06'
                                unitName:
                                  type: string
                                  nullable: true
                                  maxLength: 1000
                                  pattern: ^$|([a-zA-Z0-9\-'.,# ][a-zA-Z0-9\-'.,# ]?)*$
                                unitAddress:
                                  type: string
                                  maxLength: 1000
                                  pattern: ^$|^([-a-zA-Z0-9'.,&# ])+$
                                  nullable: true
                                unitPhone:
                                  type: object
                                  nullable: true
                                  additionalProperties: false
                                  properties:
                                    areaCode:
                                      type: string
                                      nullable: true
                                      maxLength: 3
                                      pattern: ^$|^\d{3}$
                                      example: '555'
                                    phoneNumber:
                                      type: string
                                      nullable: true
                                      maxLength: 20
                                      example: '5555555'
                                receivingInactiveDutyTrainingPay:
                                  type: string
                                  enum:
                                  - 'YES'
                                  - 'NO'
                                  nullable: true
                                  example: 'YES'
                            federalActivation:
                              description: If federalActivation is present then reservesNationalGuardService.obligationTermsOfService.beginDate, reservesNationalGuardService.obligationTermsOfService.endDate and reservesNationalGuardService.unitName are required
                              type: object
                              nullable: true
                              additionalProperties: false
                              properties:
                                activationDate:
                                  description: Date cannot be in the future and must be after the earliest servicePeriod.activeDutyBeginDate.
                                  type: string
                                  pattern: ^(?:[0-9]{4})-(?:0[1-9]|1[0-2])-(?:0[1-9]|[1-2][0-9]|3[0-1])$
                                  example: '2018-06-06'
                                  nullable: true
                                anticipatedSeparationDate:
                                  description: Anticipated date of separation. Date must be in the future.
                                  type: string
                                  pattern: ^(?:[0-9]{4})-(?:0[1-9]|1[0-2])-(?:0[1-9]|[1-2][0-9]|3[0-1])$
                                  example: '2018-06-06'
                                  nullable: true
