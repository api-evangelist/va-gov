                                    example: 2018-06-06 or 2018-06
                          if:
                            required:
                            - federalActivation
                          then:
                            required:
                            - reservesNationalGuardService
                            properties:
                              reservesNationalGuardService:
                                required:
                                - obligationTermsOfService
                                properties:
                                  obligationTermsOfService:
                                    required:
                                    - beginDate
                                    - endDate
