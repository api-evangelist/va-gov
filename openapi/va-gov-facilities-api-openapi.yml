  /facilities/{facilityId}/services:
    get:
      tags:
      - Facilities
      summary: Retrieve all services for a given facility
      description: 'Queries for services associated with a facility. Supports optional search parameters to narrow the results. By default, all services for the given facility will be returned. A search may specify a comma separated list of service ids to include by using the `serviceIds` parameter. The type of services (e.g. "health", "benefits", etc) may be specified in the `type` parameter.


        Results are paginated. JSON responses include pagination information in the standard JSON API "links" and "meta" elements.


        ### Parameter combinations

        You may optionally specify `page` and `per_page` with any query. You can query with any combination of the following:


        - `serviceIds`


        - `serviceType`


        Both parameters are optional, and both may be used independently of each other or not at all.'
      operationId: GET:/facilities/{facilityId}/services
      parameters:
      - name: facilityId
        in: path
        description: Facility ID, in the form `<prefix>_<station>`, where prefix is one of "vha", "vba", "nca", or "vc", for health facility, benefits, cemetery, or vet center, respectively.
        required: true
        schema:
          type: string
        example: vha_688
      - name: serviceIds
        in: query
        description: Comma separated list of `serviceIds` can be used alongside or independently of `serviceType`
        schema:
          type: array
          items:
            type: string
        example: covid19Vaccine
      - name: serviceType
        in: query
        description: Type of service can be used alongside or independently of `serviceIds`
        schema:
          type: string
        example: health
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedServicesResponse'
        '400':
          description: Bad request - invalid or missing query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError_2'
        '401':
          description: Authorization information not provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: No API key found in request
        '403':
          description: Invalid authorization
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: You cannot consume this service
        '404':
          description: Facility not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError_2'
        '406':
          description: Requested format unacceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError_2'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: Request size limit exceeded
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: API rate limit exceeded
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: The server took too long to respond
    servers:
    - url: https://sandbox-api.va.gov/services/va_facilities/{version}
      description: Sandbox
      variables:
        version:
          default: v1
    - url: https://api.va.gov/services/va_facilities/{version}
      description: Production
      variables:
        version:
          default: v1
