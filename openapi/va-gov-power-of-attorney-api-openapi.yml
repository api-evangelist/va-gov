                                  type: string
                                  pattern: ^[0-9]{1,5}$
                                  example: '555'
                                phoneNumber:
                                  description: Phone number for the dependent claimant.
                                  type: string
                                  pattern: ^\d(?:[- ]?\d){0,14}$
                                  example: '5555555'
                                  minLength: 1
                                  maxLength: 23
                              if:
                                properties:
