                          description: AUTHORIZATION FOR REPRESENTATIVE TO ACT ON CLAIMANT'S BEHALF TO CHANGE CLAIMANT'S ADDRESS.
                          type: boolean
                        signatures:
                          type: object
                          additionalProperties: false
                          required:
                          - veteran
