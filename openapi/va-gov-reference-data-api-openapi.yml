components:
  schemas:
    ContentionTypesResponse:
      required:
      - items
      type: object
      properties:
        totalItems:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentionType'
    MilitaryPayType:
      type: object
      properties:
        code:
          type: string
          example: RTRMT
        description:
          type: string
          example: Longevity
    Disability:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 30
        name:
          type: string
          example: abnormal weight loss
        endDateTime:
          type: string
          description: The expiration date for a code that is no longer used for new cases. Codes with expiration dates may still be referenced in older cases. If null, the code has not expired.
          format: date-time
          example: '2016-02-04T17:51:56Z'
    SpecialCircumstancesResponse:
      required:
      - items
      type: object
      properties:
        totalItems:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpecialCircumstance'
    ServiceUnavailable:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
          example: https://example.net/validation-error
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Invalid field value
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          format: int32
          example: 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: stateCode must match "^[A-Z]{2}$"
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.  It may or may not yield further information if dereferenced.
          example: e6d1119e-dc91-4b4d-b583-0f309de0807b
      example:
        type: https://api.va.gov/services/benefits-reference-data/v1/api-schema/errors/service-unavailable
        title: Service Unavailable
        status: 503
        detail: 'Cannot access service definition: standardDataService.wsdl'
        instance: e6d1119e-dc91-4b4d-b583-0f309de0807b
    TreatmentCenter:
      type: object
      properties:
        city:
          type: string
          example: MINNEAPOLIS
        id:
          type: integer
          format: int64
          example: 12965800
        name:
          type: string
          example: MINNEAPOLIS VA MEDICAL CENTER
        state:
          type: string
          example: MN
    IntakeSitesResponse:
      required:
      - items
      type: object
      properties:
        totalItems:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        links:
          type: array
          items:
            $ref: '#/components/schemas/PageLink'
        items:
          type: array
