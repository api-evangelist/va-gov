openapi: 3.2.0
info:
  title: Benefits Data Lookup Reference Data API
  description: 'This API lets you look up information that is specifically

    filtered and formatted to be accepted within VA benefits claims.'
  contact:
    name: VA.gov
  version: 0.0.1
servers:
- url: https://sandbox-api.va.gov/services/benefits-reference-data/{version}
  description: Sandbox
  variables:
    version:
      default: v1
- url: https://api.va.gov/services/benefits-reference-data/{version}
  description: Production
  variables:
    version:
      default: v1
tags:
- name: Reference Data
paths:
  /contention-types:
    get:
      tags:
      - Reference Data
      summary: Retrieve a list of contention types
      description: Provides choices for Veterans Benefits Administration (VBA) request types, such as "New", "Supplemental", or "Higher Level Review".
      operationId: GET:/contention-types
      parameters:
      - name: page
        in: query
        description: Page of results requested
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: An integer indicating the maximum number of results
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: Contention types retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentionTypesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Authorization information not provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: No API key found in request
        '403':
          description: Invalid authorization
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: You cannot consume this service
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: Request size limit exceeded
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: API rate limit exceeded
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
        '504':
          description: Gateway Timeout
          content:
            application/json:
