openapi: 3.2.0
info:
  title: Veteran Service History and Eligibility Disability Rating…
  description: 'With this API you can

    * Return enrolled benefits for a Veteran.'
  contact:
    name: VA.gov
  version: 2.1.0
servers:
- url: https://sandbox-api.va.gov/services/veteran_verification/{version}
  description: Sandbox
  variables:
    version:
      default: v2
- url: https://api.va.gov/services/veteran_verification/{version}
  description: Production
  variables:
    version:
      default: v2
tags:
- name: Disability Rating
paths:
  /disability_rating:
    get:
      tags:
      - Disability Rating
      summary: Get information about a Veteran's VA disability ratings.
      description: This endpoint provides disability ratings and related decisions and dates for a Veteran, based on the ID in the bearer token.
      operationId: GET:/disability_rating
      responses:
        '200':
          description: Disability Rating retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisabilityRatingResponseV2'
              example:
                data:
                  id: '12303'
                  type: disability-rating
                  attributes:
                    combined_disability_rating: 100
                    combined_effective_date: '2018-03-27'
                    legal_effective_date: '2018-03-27'
                    individual_ratings:
                    - decision: Service Connected
                      disability_rating_id: '1070379'
                      effective_date: '2018-03-27'
                      rating_end_date: '2022-08-27'
                      rating_percentage: 50
                      diagnostic_type_code: '0502'
                      hyph_diagnostic_type_code: '1234'
                      diagnostic_type_name: Schizophrenia, disorganized type
                      diagnostic_text: bilateral hearing loss
                      static_ind: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
              example:
                title: Bad Request
                detail: Bad Request
                code: '400'
                status: '400'
        '401':
          description: Not Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
              example:
                status: '401'
                error: Invalid Token.
                path: /veteran_verification/v2/disability_rating
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenServerError'
              example:
                status: '403'
                error: Token not granted requested scope.
                path: /veteran_verification/v2/disability_rating
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingIcn'
              example:
                title: Veteran not identifiable.
                detail: No data found for ID or demographics.
                code: '404'
                status: '404'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: Request size limit exceeded
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: API rate limit exceeded
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerApiError'
              example:
                title: Internal server error
                detail: Internal server error
                code: '500'
                status: '500'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InaccessibleServiceDefintionErrorApiError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendServiceApiError'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: The server took too long to respond
      security:
      - sandboxOauth2:
        - disability_rating.read
      - productionOauth2:
        - disability_rating.read
    post:
      tags:
      - Disability Rating
      summary: Search for information about a Veteran's VA disability ratings using…
      description: 'This endpoint provides a Veteran''s disability ratings and related decisions and dates.


        Required information:

        * First Name

        * Last Name

        * Date of Birth

        * Street Address

        * City

        * State

        * Country

        * Zipcode


        Optional information:

        * Middle Name

        * Gender

        * Mother''s Maiden Name

        * Home Phone Number

        * Birth Place City

        * Birth Place State

        * Birth Place Country


        Tips for finding a match:

        * First and Last Name, Address and DOB are often essential to uniquely identifying

        a Veteran.

        * Home Address is recommended, but it may be beneficial to retry the search with

        additional addresses if they are available and the first attempt is not confirmed.

        * To find a match, it can help to retry with different demographic information,

        such as alternate last names or addresses.

        * It can also help to remove special characters, hyphens, apostrophes, or spaces

        in a name prior to matching.


        NOTE: In the Sandbox only DOB and ZIP are required to identify the test user.'
      operationId: POST:/disability_rating
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeteranAttributes'
            example:
              first_name: Alfredo
              last_name: Armstrong
              birth_date: '1993-06-08'
              middle_name: M
              gender: M
              street_address_line1: 17020 Tortoise St
              street_address_line2: ''
              street_address_line3: ''
              city: Round Rock
              zipcode: '78664'
              state: TX
              country: USA
        required: true
      responses:
